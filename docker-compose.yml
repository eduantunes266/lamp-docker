# LAMP stack with containers: Apache + PHP (web) and MariaDB (db)
# Start:  docker compose up -d --build
# Stop:   docker compose down        (the data stays in the volume)
# Remove everything, including data: docker compose down -v

services:
  web:
    build: .                      # uses the Dockerfile in this folder (PHP 8.3 + Apache + pdo_mysql)
    container_name: lamp-web
    ports:
      - "8080:80"                 # host port : container port
    volumes:
      - ./app:/var/www/html       # bind mount: the PHP code can be edited without a rebuild
    environment:
      DB_HOST: db                 # service name = host name on the internal network
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy   # only starts once the database is ready
    networks:
      - backend
    restart: unless-stopped

  db:
    image: mariadb:11
    container_name: lamp-db
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql                                  # volume: persistent data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro   # only runs on the first start
    # No "ports": the database is NOT reachable from outside the internal network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend
    restart: unless-stopped

volumes:
  db_data:

networks:
  backend:
